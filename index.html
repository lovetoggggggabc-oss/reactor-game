<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RE:ACTOR Prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a10;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.hero{position:absolute;left:18px;top:18px}.hero b{font-size:17px}.hero small{display:block;color:#9ca6ba}.bar{width:220px;height:7px;background:#272c39;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#eef2fa}.enemy{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center}.enemy .bar{width:180px}.enemy .bar i{background:#bfc6d7}.joy{pointer-events:auto;position:absolute;left:22px;bottom:24px;width:118px;height:118px;border:1px solid #8992a744;border-radius:50%;background:#fff1}.knob{position:absolute;width:44px;height:44px;left:36px;top:36px;border-radius:50%;background:#cbd3e333}.actions{pointer-events:auto;position:absolute;right:18px;bottom:22px;display:grid;grid-template-columns:56px 72px 56px;gap:9px;align-items:end}.btn{height:56px;border-radius:50%;border:1px solid #8994aa77;background:#151a27dd;color:#fff;font-weight:700}.atk{height:72px;font-size:15px}.skill{border-color:#aab8db99}.ult{position:absolute;right:92px;bottom:112px;width:58px;height:58px;border-color:#b7a8e999}.hint{position:absolute;right:15px;top:15px;color:#8993a8;font-size:11px;text-align:right}.flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><canvas id="game"></canvas><div id="ui"><div class="hero"><b>AMAGI REI <span style="color:#9ba6bd">/ LUNE</span></b><small>월광도 · 파열</small><div class="bar"><i id="php"></i></div></div><div class="enemy"><b>TRAINING HOUND</b><div class="bar"><i id="ehp"></i></div></div><div class="hint">PC: WASD 이동 · Space 회피 · J 공격 · K 초승<br>모바일: 왼쪽 스틱 + 오른쪽 버튼</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn skill" id="skill">초승</button><button class="btn atk" id="attack">공격</button><button class="btn" id="dodge">회피</button></div><button class="btn ult" id="ult">월하</button><div class="flash" id="flash"></div></div>
<script>
const C=document.querySelector('#game'),g=C.getContext('2d');let W,H,D;function rs(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let p={x:0,z:220,hp:100,face:0},e={x:0,z:-130,hp:100,state:'chase',timer:0},keys={},joyX=0,joyY=0,dash=0,attack=0,skill=0,ult=0,rupture=0,shake=0,combo=0,comboTimer=0,invuln=0,perfect=0,counterReady=0,hitStop=0,enemyStun=0,slashKind=0,damageTexts=[],camYaw=0,camPitch=.16,camDist=760;
const ehp=document.querySelector('#ehp'),flash=document.querySelector('#flash');function hit(n,r=false){if(Math.hypot(p.x-e.x,p.z-e.z)<230){e.hp=Math.max(0,e.hp-n);if(r)rupture=Math.min(5,rupture+1);ehp.style.width=e.hp+'%';shake=8;if(e.hp<=0)setTimeout(()=>{e.hp=100;e.x=(Math.random()-.5)*350;e.z=-180;rupture=0;ehp.style.width='100%'},700)}}
function atk(){attack=10;combo=combo%5+1;hit(combo===5?18:8,combo===5)}function sk(){skill=16;hit(20+rupture*8,true)}function dg(){dash=12}function ul(){ult=30;hit(35+rupture*15);rupture=0;flash.animate([{opacity:.55},{opacity:0}],{duration:350})}
document.querySelector('#attack').onpointerdown=atk;document.querySelector('#skill').onpointerdown=sk;document.querySelector('#dodge').onpointerdown=dg;document.querySelector('#ult').onpointerdown=ul;
addEventListener('keydown',q=>{keys[q.key.toLowerCase()]=1;if(q.key===' ')dg();if(q.key.toLowerCase()==='j')atk();if(q.key.toLowerCase()==='k')sk();if(q.key.toLowerCase()==='l')ul()});addEventListener('keyup',q=>keys[q.key.toLowerCase()]=0);
let joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),pid=null,camPid=null,camLastX=0,camLastY=0;joy.onpointerdown=q=>{pid=q.pointerId;joy.setPointerCapture(pid)};joy.onpointermove=q=>{if(q.pointerId!==pid)return;let r=joy.getBoundingClientRect(),dx=q.clientX-r.left-59,dy=q.clientY-r.top-59,m=Math.hypot(dx,dy)||1,s=Math.min(35,m);joyX=dx/m*s/35;joyY=dy/m*s/35;knob.style.transform=`translate(${joyX*35}px,${joyY*35}px)`};joy.onpointerup=()=>{pid=null;joyX=joyY=0;knob.style.transform=''};C.addEventListener('pointerdown',q=>{if(q.clientX<W*.38)return;camPid=q.pointerId;camLastX=q.clientX;camLastY=q.clientY;C.setPointerCapture(q.pointerId)});C.addEventListener('pointermove',q=>{if(q.pointerId!==camPid)return;let dx=q.clientX-camLastX,dy=q.clientY-camLastY;camYaw-=dx*.006;camPitch=Math.max(-.18,Math.min(.5,camPitch+dy*.004));camLastX=q.clientX;camLastY=q.clientY});C.addEventListener('pointerup',q=>{if(q.pointerId===camPid)camPid=null});
function project(x,z,y=0){let dx=x-p.x,dz=z-p.z,cs=Math.cos(camYaw),sn=Math.sin(camYaw),rx=dx*cs-dz*sn,rz=dx*sn+dz*cs;let cp=Math.cos(camPitch),sp=Math.sin(camPitch),ry=y*cp-rz*sp,rz2=rz*cp+y*sp;let depth=rz2+camDist,scale=640/Math.max(220,depth);return[W/2+rx*scale,H*.78-ry*scale,scale]}
function drawChar(o,enemy=false){let q=project(o.x,o.z,65),s=q[2]*(enemy?1:1.35);g.save();g.translate(q[0],q[1]);g.scale(s,s);if(enemy){g.fillStyle='#4c5364';g.beginPath();g.ellipse(0,-24,34,25,0,0,7);g.fill();g.fillStyle='#c8ced9';g.fillRect(-25,-35,7,7);g.fillRect(18,-35,7,7)}else{g.fillStyle='#d7dce7';g.beginPath();g.arc(0,-58,17,0,7);g.fill();g.fillStyle='#171c28';g.beginPath();g.moveTo(-19,-42);g.lineTo(20,-42);g.lineTo(27,18);g.lineTo(-24,18);g.fill();g.strokeStyle='#e7ebf5';g.lineWidth=4;g.beginPath();g.moveTo(15,-28);g.lineTo(45,-82);g.stroke();if(attack||skill){g.strokeStyle=skill?'#aebce5':'#edf2ff';g.lineWidth=slashKind===5||slashKind===6?6:3;g.beginPath();let a1=-1.5,a2=1.1;if(slashKind===2){a1=1.9;a2=4.7}if(slashKind===3){a1=-.4;a2=2.2}if(slashKind===4){a1=-2.5;a2=.3}if(slashKind===5){a1=-2.8;a2=.7}if(slashKind===6){a1=-3.0;a2=.4}g.arc(0,-30,skill?95:(slashKind>=5?92:70),a1,a2);g.stroke()}}g.restore()}
function loop(){requestAnimationFrame(loop);let mx=(keys.d?1:0)-(keys.a?1:0)+joyX,my=(keys.s?1:0)-(keys.w?1:0)+joyY,m=Math.hypot(mx,my);if(m){mx/=m;my/=m;let cs=Math.cos(camYaw),sn=Math.sin(camYaw),wx=mx*cs+my*sn,wz=-mx*sn+my*cs,sp=dash?12:4;p.x+=wx*sp;p.z+=wz*sp;p.face=Math.atan2(wx,wz);p.x=Math.max(-900,Math.min(900,p.x));p.z=Math.max(-900,Math.min(900,p.z))}if(hitStop){hitStop--;g.save();g.fillStyle='#0a0d14';g.fillRect(0,0,W,H);g.restore();return}if(dash)dash--;if(attack)attack--;if(skill)skill--;if(ult)ult--;if(comboTimer)comboTimer--;else combo=0;if(invuln)invuln--;if(perfect)perfect--;if(counterReady)counterReady--;if(enemyStun)enemyStun--;
let edx=p.x-e.x,edz=p.z-e.z,ed=Math.hypot(edx,edz)||1;
if(e.hp>0&&!enemyStun){if(e.state==='chase'){if(ed>145){e.x+=edx/ed*2.15;e.z+=edz/ed*2.15}else{e.state='windup';e.timer=55}}else if(e.state==='windup'){if(--e.timer<=0){let dd=Math.hypot(p.x-e.x,p.z-e.z);if(dd<220){if(invuln){perfect=34;counterReady=34;skill=0;flash.animate([{opacity:.22},{opacity:0}],{duration:180})}else{p.hp=Math.max(0,p.hp-14);php.style.width=p.hp+'%';shake=12;flash.animate([{opacity:.16},{opacity:0}],{duration:150})}}e.state='recover';e.timer=38}}else if(e.state==='recover'){if(--e.timer<=0)e.state='chase'}}
g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#101522');grd.addColorStop(1,'#080a10');g.fillStyle=grd;g.fillRect(0,0,W,H);g.fillStyle='#111622';g.beginPath();g.moveTo(0,H*.48);g.lineTo(W,H*.48);g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fill();g.strokeStyle='#222938';g.beginPath();g.moveTo(0,H*.48);g.lineTo(W,H*.48);g.stroke();drawChar(e,true);if(e.state==='windup'){let q=project(e.x,e.z,35),pq=project(p.x,p.z,35);g.strokeStyle='#ff8f8f';g.lineWidth=4;g.beginPath();g.arc(q[0],q[1],46+Math.sin(e.timer*.4)*5,0,Math.PI*2);g.stroke();g.globalAlpha=.35;g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(pq[0],pq[1]);g.stroke();g.globalAlpha=1}drawChar(p,false);if(perfect){g.fillStyle='#eef2ff';g.font='700 15px system-ui';g.textAlign='center';g.fillText(counterReady?'정확한 회피 · 공격으로 월반':'정확한 회피',W/2,H*.38)}damageTexts.forEach(d=>{let q=project(d.x,d.z,125);g.fillStyle='#fff';g.font='800 22px system-ui';g.textAlign='center';g.fillText(d.n,q[0],q[1]-(46-d.t)*1.1);d.t--});damageTexts=damageTexts.filter(d=>d.t>0);if(rupture){let q=project(e.x,e.z,125);g.fillStyle='#d8def0';g.font='12px system-ui';g.textAlign='center';g.fillText('파열 '+rupture,q[0],q[1])}g.restore()}loop();
let lastTouchEnd=0;document.addEventListener('touchend',ev=>{const now=Date.now();if(now-lastTouchEnd<=350)ev.preventDefault();lastTouchEnd=now},{passive:false});document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false});document.addEventListener('gesturechange',ev=>ev.preventDefault(),{passive:false});document.addEventListener('gestureend',ev=>ev.preventDefault(),{passive:false});
</script></body></html>
