<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>RE:ACTOR Prototype</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080a10;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block}#ui{position:fixed;inset:0;pointer-events:none}.hero{position:absolute;left:18px;top:18px}.hero b{font-size:17px}.hero small{display:block;color:#9ca6ba}.bar{width:220px;height:7px;background:#272c39;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#eef2fa}.enemy{position:absolute;top:18px;left:50%;transform:translateX(-50%);text-align:center}.enemy .bar{width:180px}.enemy .bar i{background:#bfc6d7}.joy{pointer-events:auto;position:absolute;left:22px;bottom:24px;width:118px;height:118px;border:1px solid #8992a744;border-radius:50%;background:#fff1}.knob{position:absolute;width:44px;height:44px;left:36px;top:36px;border-radius:50%;background:#cbd3e333}.actions{pointer-events:auto;position:absolute;right:18px;bottom:22px;display:grid;grid-template-columns:56px 72px 56px;gap:9px;align-items:end}.btn{height:56px;border-radius:50%;border:1px solid #8994aa77;background:#151a27dd;color:#fff;font-weight:700}.atk{height:72px;font-size:15px}.skill{border-color:#aab8db99}.ult{position:absolute;right:92px;bottom:112px;width:58px;height:58px;border-color:#b7a8e999}.hint{position:absolute;right:15px;top:15px;color:#8993a8;font-size:11px;text-align:right}.flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body><canvas id="game"></canvas><div id="ui"><div class="hero"><b>AMAGI REI <span style="color:#9ba6bd">/ LUNE</span></b><small>월광도 · 파열</small><div class="bar"><i id="php"></i></div></div><div class="enemy"><b>TRAINING HOUND</b><div class="bar"><i id="ehp"></i></div></div><div class="hint">PC: WASD 이동 · Space 회피 · J 공격 · K 초승<br>모바일: 왼쪽 스틱 + 오른쪽 버튼</div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="btn skill" id="skill">초승</button><button class="btn atk" id="attack">공격</button><button class="btn" id="dodge">회피</button></div><button class="btn ult" id="ult">월하</button><div class="flash" id="flash"></div></div>
<script>
const C=document.querySelector('#game'),g=C.getContext('2d');let W,H,D;function rs(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;C.width=W*D;C.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',rs);rs();
let p={x:0,z:220,hp:100,face:0},e={x:0,z:-130,hp:100},keys={},joyX=0,joyY=0,dash=0,attack=0,skill=0,ult=0,rupture=0,shake=0,combo=0;
const ehp=document.querySelector('#ehp'),flash=document.querySelector('#flash');function hit(n,r=false){if(Math.hypot(p.x-e.x,p.z-e.z)<230){e.hp=Math.max(0,e.hp-n);if(r)rupture=Math.min(5,rupture+1);ehp.style.width=e.hp+'%';shake=8;if(e.hp<=0)setTimeout(()=>{e.hp=100;e.x=(Math.random()-.5)*350;e.z=-180;rupture=0;ehp.style.width='100%'},700)}}
function atk(){attack=10;combo=combo%5+1;hit(combo===5?18:8,combo===5)}function sk(){skill=16;hit(20+rupture*8,true)}function dg(){dash=12}function ul(){ult=30;hit(35+rupture*15);rupture=0;flash.animate([{opacity:.55},{opacity:0}],{duration:350})}
document.querySelector('#attack').onpointerdown=atk;document.querySelector('#skill').onpointerdown=sk;document.querySelector('#dodge').onpointerdown=dg;document.querySelector('#ult').onpointerdown=ul;
addEventListener('keydown',q=>{keys[q.key.toLowerCase()]=1;if(q.key===' ')dg();if(q.key.toLowerCase()==='j')atk();if(q.key.toLowerCase()==='k')sk();if(q.key.toLowerCase()==='l')ul()});addEventListener('keyup',q=>keys[q.key.toLowerCase()]=0);
let joy=document.querySelector('#joy'),knob=document.querySelector('#knob'),pid=null;joy.onpointerdown=q=>{pid=q.pointerId;joy.setPointerCapture(pid)};joy.onpointermove=q=>{if(q.pointerId!==pid)return;let r=joy.getBoundingClientRect(),dx=q.clientX-r.left-59,dy=q.clientY-r.top-59,m=Math.hypot(dx,dy)||1,s=Math.min(35,m);joyX=dx/m*s/35;joyY=dy/m*s/35;knob.style.transform=`translate(${joyX*35}px,${joyY*35}px)`};joy.onpointerup=()=>{pid=null;joyX=joyY=0;knob.style.transform=''};
function project(x,z,y=0){let scale=560/(z+850);return[W/2+x*scale,H*.62+z*.19*scale-y*scale,scale]}
function drawChar(o,enemy=false){let q=project(o.x,o.z,65),s=q[2];g.save();g.translate(q[0],q[1]);g.scale(s,s);if(enemy){g.fillStyle='#4c5364';g.beginPath();g.ellipse(0,-24,34,25,0,0,7);g.fill();g.fillStyle='#c8ced9';g.fillRect(-25,-35,7,7);g.fillRect(18,-35,7,7)}else{g.fillStyle='#d7dce7';g.beginPath();g.arc(0,-58,17,0,7);g.fill();g.fillStyle='#171c28';g.beginPath();g.moveTo(-19,-42);g.lineTo(20,-42);g.lineTo(27,18);g.lineTo(-24,18);g.fill();g.strokeStyle='#e7ebf5';g.lineWidth=4;g.beginPath();g.moveTo(15,-28);g.lineTo(45,-82);g.stroke();if(attack||skill){g.strokeStyle=skill?'#aebce5':'#edf2ff';g.lineWidth=3;g.beginPath();g.arc(0,-30,skill?95:70,-1.5,1.1);g.stroke()}}g.restore()}
function loop(){requestAnimationFrame(loop);let mx=(keys.d?1:0)-(keys.a?1:0)+joyX,my=(keys.s?1:0)-(keys.w?1:0)+joyY,m=Math.hypot(mx,my);if(m){mx/=m;my/=m;let sp=dash?12:4;p.x+=mx*sp;p.z+=my*sp;p.x=Math.max(-520,Math.min(520,p.x));p.z=Math.max(-400,Math.min(500,p.z))}if(dash)dash--;if(attack)attack--;if(skill)skill--;if(ult)ult--;
g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake--}let grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#101522');grd.addColorStop(1,'#080a10');g.fillStyle=grd;g.fillRect(0,0,W,H);g.strokeStyle='#242a38';for(let i=-8;i<=8;i++){let a=project(i*90,-650),b=project(i*90,700);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}drawChar(e,true);drawChar(p,false);if(rupture){let q=project(e.x,e.z,125);g.fillStyle='#d8def0';g.font='12px system-ui';g.textAlign='center';g.fillText('파열 '+rupture,q[0],q[1])}g.restore()}loop();
let lastTouchEnd=0;document.addEventListener('touchend',ev=>{const now=Date.now();if(now-lastTouchEnd<=350)ev.preventDefault();lastTouchEnd=now},{passive:false});document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false});document.addEventListener('gesturechange',ev=>ev.preventDefault(),{passive:false});document.addEventListener('gestureend',ev=>ev.preventDefault(),{passive:false});
</script></body></html>
